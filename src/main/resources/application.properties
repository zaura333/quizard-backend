# Datasource
spring.datasource.url=jdbc:mysql://localhost:3307/quizard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=quizard
spring.datasource.password=quizard
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=zmien-ten-sekret-na-produkcji-min-32-znaki!!
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:5173

# Server
server.port=8080
